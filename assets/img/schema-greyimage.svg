<svg viewBox="0 0 820 460" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif">
  <rect width="820" height="460" fill="#1e1e2e" rx="10"/>
  <rect width="820" height="34" fill="#313244" rx="10"/>
  <rect y="20" width="820" height="14" fill="#313244"/>
  <circle cx="18" cy="17" r="6" fill="#f38ba8"/>
  <circle cx="38" cy="17" r="6" fill="#f9e2af"/>
  <circle cx="58" cy="17" r="6" fill="#a6e3a1"/>
  <text x="410" y="22" text-anchor="middle" font-size="12" fill="#cdd6f4">GreyImage.java — Traitement d'images en niveaux de gris</text>

  <!-- Left: Code -->
  <text x="24" y="60" font-size="10" font-family="Courier New,monospace" fill="#6c7086">/**</text>
  <text x="24" y="74" font-size="10" font-family="Courier New,monospace" fill="#6c7086"> * Image 2D stockee dans un tableau 1D linearise</text>
  <text x="24" y="88" font-size="10" font-family="Courier New,monospace" fill="#6c7086"> * Acces pixel(x,y) = data[y * largeur + x]</text>
  <text x="24" y="102" font-size="10" font-family="Courier New,monospace" fill="#6c7086"> */</text>
  <text x="24" y="118" font-size="10" font-family="Courier New,monospace" fill="#89b4fa">public class</text>
  <text x="96" y="118" font-size="10" font-family="Courier New,monospace" fill="#a6e3a1"> GreyImage</text>
  <text x="158" y="118" font-size="10" font-family="Courier New,monospace" fill="#cdd6f4"> {</text>
  <text x="24" y="136" font-size="10" font-family="Courier New,monospace" fill="#89b4fa">  private int</text>
  <text x="95" y="136" font-size="10" font-family="Courier New,monospace" fill="#cdd6f4">[] data;</text>
  <text x="24" y="152" font-size="10" font-family="Courier New,monospace" fill="#89b4fa">  private int</text>
  <text x="95" y="152" font-size="10" font-family="Courier New,monospace" fill="#cdd6f4"> largeur, hauteur;</text>

  <text x="24" y="172" font-size="10" font-family="Courier New,monospace" fill="#89b4fa">  public</text>
  <text x="66" y="172" font-size="10" font-family="Courier New,monospace" fill="#a6e3a1"> GreyImage</text>
  <text x="128" y="172" font-size="10" font-family="Courier New,monospace" fill="#cdd6f4">(int l, int h) {</text>
  <text x="24" y="188" font-size="10" font-family="Courier New,monospace" fill="#cdd6f4">    this.largeur = l;  this.hauteur = h;</text>
  <text x="24" y="204" font-size="10" font-family="Courier New,monospace" fill="#cdd6f4">    this.data = </text>
  <text x="103" y="204" font-size="10" font-family="Courier New,monospace" fill="#89b4fa">new int</text>
  <text x="137" y="204" font-size="10" font-family="Courier New,monospace" fill="#cdd6f4">[l * h];</text>
  <text x="24" y="220" font-size="10" font-family="Courier New,monospace" fill="#cdd6f4">  }</text>

  <text x="24" y="240" font-size="10" font-family="Courier New,monospace" fill="#89b4fa">  public int</text>
  <text x="90" y="240" font-size="10" font-family="Courier New,monospace" fill="#a6e3a1"> getPixel</text>
  <text x="140" y="240" font-size="10" font-family="Courier New,monospace" fill="#cdd6f4">(int x, int y) {</text>
  <text x="24" y="256" font-size="10" font-family="Courier New,monospace" fill="#89b4fa">    return</text>
  <text x="68" y="256" font-size="10" font-family="Courier New,monospace" fill="#cdd6f4"> data[y * largeur + x];</text>
  <text x="24" y="272" font-size="10" font-family="Courier New,monospace" fill="#cdd6f4">  }</text>

  <text x="24" y="292" font-size="10" font-family="Courier New,monospace" fill="#89b4fa">  public void</text>
  <text x="94" y="292" font-size="10" font-family="Courier New,monospace" fill="#a6e3a1"> negatif</text>
  <text x="138" y="292" font-size="10" font-family="Courier New,monospace" fill="#cdd6f4">() {</text>
  <text x="24" y="308" font-size="10" font-family="Courier New,monospace" fill="#89b4fa">    for </text>
  <text x="54" y="308" font-size="10" font-family="Courier New,monospace" fill="#cdd6f4">(int i = 0; i &lt; data.length; i++)</text>
  <text x="24" y="324" font-size="10" font-family="Courier New,monospace" fill="#cdd6f4">      data[i] = </text>
  <text x="93" y="324" font-size="10" font-family="Courier New,monospace" fill="#f9e2af">255</text>
  <text x="112" y="324" font-size="10" font-family="Courier New,monospace" fill="#cdd6f4"> - data[i];</text>
  <text x="24" y="340" font-size="10" font-family="Courier New,monospace" fill="#cdd6f4">  }</text>

  <text x="24" y="360" font-size="10" font-family="Courier New,monospace" fill="#89b4fa">  public void</text>
  <text x="94" y="360" font-size="10" font-family="Courier New,monospace" fill="#a6e3a1"> seuillage</text>
  <text x="148" y="360" font-size="10" font-family="Courier New,monospace" fill="#cdd6f4">(int seuil) {</text>
  <text x="24" y="376" font-size="10" font-family="Courier New,monospace" fill="#89b4fa">    for </text>
  <text x="54" y="376" font-size="10" font-family="Courier New,monospace" fill="#cdd6f4">(int i = 0; i &lt; data.length; i++)</text>
  <text x="24" y="392" font-size="10" font-family="Courier New,monospace" fill="#cdd6f4">      data[i] = (data[i] &gt;= seuil) ? </text>
  <text x="208" y="392" font-size="10" font-family="Courier New,monospace" fill="#f9e2af">255</text>
  <text x="226" y="392" font-size="10" font-family="Courier New,monospace" fill="#cdd6f4"> : </text>
  <text x="240" y="392" font-size="10" font-family="Courier New,monospace" fill="#f9e2af">0</text>
  <text x="248" y="392" font-size="10" font-family="Courier New,monospace" fill="#cdd6f4">;</text>
  <text x="24" y="408" font-size="10" font-family="Courier New,monospace" fill="#cdd6f4">  }</text>
  <text x="24" y="424" font-size="10" font-family="Courier New,monospace" fill="#cdd6f4">}</text>

  <!-- Divider -->
  <line x1="400" y1="44" x2="400" y2="440" stroke="#45475a" stroke-width="1"/>

  <!-- Right: Visual explanation -->
  <text x="430" y="60" font-size="11" fill="#89b4fa" font-weight="bold">Tableau 2D classique (lent)</text>
  <!-- 2D array visual -->
  <rect x="420" y="68" width="160" height="80" fill="#2a2a3e" rx="4"/>
  <text x="430" y="84" font-size="9" font-family="Courier New,monospace" fill="#6c7086">int[4][4] :</text>
  <text x="430" y="100" font-size="9" font-family="Courier New,monospace" fill="#cdd6f4">data[0][0]=120  data[0][1]=85</text>
  <text x="430" y="114" font-size="9" font-family="Courier New,monospace" fill="#cdd6f4">data[1][0]=200  data[1][1]=64</text>
  <text x="430" y="128" font-size="9" font-family="Courier New,monospace" fill="#f38ba8">Acces indirect (2 indices)</text>
  <text x="430" y="142" font-size="9" font-family="Courier New,monospace" fill="#f38ba8">Cache CPU non-contigu</text>

  <text x="590" y="60" font-size="11" fill="#a6e3a1" font-weight="bold">Tableau 1D linearise (rapide)</text>
  <rect x="588" y="68" width="200" height="80" fill="#1a3a2a" rx="4"/>
  <text x="598" y="84" font-size="9" font-family="Courier New,monospace" fill="#6c7086">int[16] linearise :</text>
  <text x="598" y="100" font-size="9" font-family="Courier New,monospace" fill="#cdd6f4">data[0]=120  data[1]=85</text>
  <text x="598" y="114" font-size="9" font-family="Courier New,monospace" fill="#cdd6f4">data[4]=200  data[5]=64</text>
  <text x="598" y="128" font-size="9" font-family="Courier New,monospace" fill="#a6e3a1">pixel(x,y) = data[y*L+x]</text>
  <text x="598" y="142" font-size="9" font-family="Courier New,monospace" fill="#a6e3a1">Acces contigu — cache-friendly</text>

  <!-- Pixel grid visualization -->
  <text x="430" y="170" font-size="11" fill="#cdd6f4" font-weight="bold">Grille pixels 6x4 — avant / apres filtres</text>

  <!-- Grid original -->
  <text x="430" y="188" font-size="9" fill="#89b4fa">Original</text>
  <rect x="430" y="192" width="24" height="24" fill="rgb(30,30,30)"/><text x="442" y="208" text-anchor="middle" font-size="8" fill="#cdd6f4">30</text>
  <rect x="454" y="192" width="24" height="24" fill="rgb(120,120,120)"/><text x="466" y="208" text-anchor="middle" font-size="8" fill="#cdd6f4">120</text>
  <rect x="478" y="192" width="24" height="24" fill="rgb(200,200,200)"/><text x="490" y="208" text-anchor="middle" font-size="8" fill="#1e1e2e">200</text>
  <rect x="502" y="192" width="24" height="24" fill="rgb(80,80,80)"/><text x="514" y="208" text-anchor="middle" font-size="8" fill="#cdd6f4">80</text>
  <rect x="526" y="192" width="24" height="24" fill="rgb(150,150,150)"/><text x="538" y="208" text-anchor="middle" font-size="8" fill="#cdd6f4">150</text>
  <rect x="550" y="192" width="24" height="24" fill="rgb(240,240,240)"/><text x="562" y="208" text-anchor="middle" font-size="8" fill="#1e1e2e">240</text>

  <!-- Grid negative -->
  <text x="430" y="235" font-size="9" fill="#f38ba8">Negatif (255-v)</text>
  <rect x="430" y="238" width="24" height="24" fill="rgb(225,225,225)"/><text x="442" y="254" text-anchor="middle" font-size="8" fill="#1e1e2e">225</text>
  <rect x="454" y="238" width="24" height="24" fill="rgb(135,135,135)"/><text x="466" y="254" text-anchor="middle" font-size="8" fill="#1e1e2e">135</text>
  <rect x="478" y="238" width="24" height="24" fill="rgb(55,55,55)"/><text x="490" y="254" text-anchor="middle" font-size="8" fill="#cdd6f4">55</text>
  <rect x="502" y="238" width="24" height="24" fill="rgb(175,175,175)"/><text x="514" y="254" text-anchor="middle" font-size="8" fill="#1e1e2e">175</text>
  <rect x="526" y="238" width="24" height="24" fill="rgb(105,105,105)"/><text x="538" y="254" text-anchor="middle" font-size="8" fill="#cdd6f4">105</text>
  <rect x="550" y="238" width="24" height="24" fill="rgb(15,15,15)"/><text x="562" y="254" text-anchor="middle" font-size="8" fill="#cdd6f4">15</text>

  <!-- Grid seuillage -->
  <text x="430" y="280" font-size="9" fill="#f9e2af">Seuillage (seuil=128)</text>
  <rect x="430" y="284" width="24" height="24" fill="rgb(0,0,0)"/><text x="442" y="300" text-anchor="middle" font-size="8" fill="#cdd6f4">0</text>
  <rect x="454" y="284" width="24" height="24" fill="rgb(0,0,0)"/><text x="466" y="300" text-anchor="middle" font-size="8" fill="#cdd6f4">0</text>
  <rect x="478" y="284" width="24" height="24" fill="rgb(255,255,255)"/><text x="490" y="300" text-anchor="middle" font-size="8" fill="#1e1e2e">255</text>
  <rect x="502" y="284" width="24" height="24" fill="rgb(0,0,0)"/><text x="514" y="300" text-anchor="middle" font-size="8" fill="#cdd6f4">0</text>
  <rect x="526" y="284" width="24" height="24" fill="rgb(255,255,255)"/><text x="538" y="300" text-anchor="middle" font-size="8" fill="#1e1e2e">255</text>
  <rect x="550" y="284" width="24" height="24" fill="rgb(255,255,255)"/><text x="562" y="300" text-anchor="middle" font-size="8" fill="#1e1e2e">255</text>

  <!-- Test output -->
  <rect x="420" y="328" width="374" height="104" fill="#1a1a2e" rx="6" stroke="#45475a" stroke-width="1"/>
  <text x="436" y="346" font-size="9" font-family="Courier New,monospace" fill="#6c7086">$ java -cp . GreyImageTest</text>
  <text x="436" y="362" font-size="9" font-family="Courier New,monospace" fill="#a6e3a1">Test 1 - getPixel(2,1) = 200 ... OK</text>
  <text x="436" y="376" font-size="9" font-family="Courier New,monospace" fill="#a6e3a1">Test 2 - negatif() pixel(0,0) = 225 ... OK</text>
  <text x="436" y="390" font-size="9" font-family="Courier New,monospace" fill="#a6e3a1">Test 3 - seuillage(128) pixel(2,0) = 255 ... OK</text>
  <text x="436" y="404" font-size="9" font-family="Courier New,monospace" fill="#a6e3a1">Test 4 - lecture/ecriture PGM ... OK</text>
  <text x="436" y="420" font-size="9" font-family="Courier New,monospace" fill="#a6e3a1">All tests passed (4/4)</text>
</svg>
