  <text x="36" y="272" font-size="10" font-family="Courier New,monospace" fill="#6c7086"># .gitlab-ci.yml</text>
  <text x="36" y="288" font-size="10" font-family="Courier New,monospace" fill="#89b4fa">stages: [test, build, package, deploy]</text>
  <text x="36" y="308" font-size="10" font-family="Courier New,monospace" fill="#89b4fa">unit-tests:</text>
  <text x="36" y="322" font-size="10" font-family="Courier New,monospace" fill="#a6e3a1">  stage: test    image: python:3.11</text>
  <text x="36" y="336" font-size="10" font-family="Courier New,monospace" fill="#cdd6f4">  services: [mysql:8.0]</text>
  <text x="36" y="350" font-size="10" font-family="Courier New,monospace" fill="#cdd6f4">  script: [pip install -r requirements.txt, pytest tests/ --cov=src]</text>
  <text x="36" y="364" font-size="10" font-family="Courier New,monospace" fill="#f9e2af">  only: [main, merge_requests]</text>
  <text x="440" y="288" font-size="10" font-family="Courier New,monospace" fill="#89b4fa">deploy-staging:</text>
  <text x="440" y="308" font-size="10" font-family="Courier New,monospace" fill="#a6e3a1">  stage: deploy</text>
  <text x="440" y="322" font-size="10" font-family="Courier New,monospace" fill="#cdd6f4">  environment: staging</text>
  <text x="440" y="336" font-size="10" font-family="Courier New,monospace" fill="#f9e2af">  when: manual</text>
  <text x="440" y="350" font-size="10" font-family="Courier New,monospace" fill="#cdd6f4">  script:</text>
  <text x="440" y="364" font-size="10" font-family="Courier New,monospace" fill="#cdd6f4">    - docker pull registry/app:$CI_SHA</text>
  <text x="440" y="378" font-size="10" font-family="Courier New,monospace" fill="#cdd6f4">    - docker-compose up -d --no-deps app</text>
