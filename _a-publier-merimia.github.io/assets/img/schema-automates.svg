<svg viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" font-size="12">
  <rect width="860" height="520" fill="#f8f9fa"/>
  <rect width="860" height="48" fill="#2563EB"/>
  <text x="430" y="20" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Automates Finis Deterministes -- Minimisation par Nerode</text>
  <text x="430" y="38" text-anchor="middle" font-size="11" fill="#BFDBFE">Langage L : mots sur {a, b} avec un nombre pair de 'a'</text>

  <!-- LEFT: 4-state automaton -->
  <text x="175" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">Automate original -- 4 etats</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3z" fill="#374151"/>
    </marker>
  </defs>

  <!-- Initial arrow to q0 -->
  <line x1="44" y1="180" x2="68" y2="180" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <!-- q0 accepting (double circle) -->
  <circle cx="100" cy="180" r="30" fill="white" stroke="#2563EB" stroke-width="2.5"/>
  <circle cx="100" cy="180" r="23" fill="none" stroke="#2563EB" stroke-width="1.5"/>
  <text x="100" y="176" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">q</text>
  <text x="109" y="182" text-anchor="middle" font-size="9" fill="#1e3a8a">0</text>

  <!-- q1 -->
  <circle cx="260" cy="180" r="30" fill="white" stroke="#374151" stroke-width="2"/>
  <text x="260" y="176" text-anchor="middle" font-size="11" font-weight="bold" fill="#374151">q</text>
  <text x="269" y="182" text-anchor="middle" font-size="9" fill="#374151">1</text>

  <!-- q2 accepting -->
  <circle cx="100" cy="310" r="30" fill="white" stroke="#2563EB" stroke-width="2.5"/>
  <circle cx="100" cy="310" r="23" fill="none" stroke="#2563EB" stroke-width="1.5"/>
  <text x="100" y="306" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">q</text>
  <text x="109" y="312" text-anchor="middle" font-size="9" fill="#1e3a8a">2</text>

  <!-- q3 -->
  <circle cx="260" cy="310" r="30" fill="white" stroke="#374151" stroke-width="2"/>
  <text x="260" y="306" text-anchor="middle" font-size="11" font-weight="bold" fill="#374151">q</text>
  <text x="269" y="312" text-anchor="middle" font-size="9" fill="#374151">3</text>

  <!-- transition q0 vers q1 sur a -->
  <line x1="130" y1="175" x2="228" y2="175" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="179" y="167" text-anchor="middle" font-size="11" fill="#16a34a" font-weight="bold">a</text>

  <!-- transition q1 vers q0 sur a -->
  <path d="M228,185 Q179,210 130,185" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  <text x="179" y="208" text-anchor="middle" font-size="11" fill="#16a34a" font-weight="bold">a</text>

  <!-- boucle q0 sur b -->
  <path d="M80,155 Q55,120 118,152" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  <text x="60" y="120" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="bold">b</text>

  <!-- boucle q1 sur b -->
  <path d="M242,155 Q238,115 280,155" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  <text x="254" y="114" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="bold">b</text>

  <!-- transition q2 vers q3 sur a -->
  <line x1="130" y1="305" x2="228" y2="305" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="179" y="297" text-anchor="middle" font-size="11" fill="#16a34a" font-weight="bold">a</text>

  <!-- transition q3 vers q2 sur a -->
  <path d="M228,315 Q179,340 130,315" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  <text x="179" y="340" text-anchor="middle" font-size="11" fill="#16a34a" font-weight="bold">a</text>

  <!-- boucle q2 sur b -->
  <path d="M80,285 Q55,250 118,282" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  <text x="60" y="248" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="bold">b</text>

  <!-- boucle q3 sur b -->
  <path d="M242,285 Q238,245 280,285" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  <text x="254" y="244" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="bold">b</text>

  <!-- q0 and q2 vertical connection to show they're equivalent -->
  <line x1="100" y1="210" x2="100" y2="278" stroke="#2563EB" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="260" y1="210" x2="260" y2="278" stroke="#374151" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Labels -->
  <rect x="56" y="356" width="88" height="22" fill="#DBEAFE" stroke="#2563EB" stroke-width="1" rx="4"/>
  <text x="100" y="371" text-anchor="middle" font-size="10" fill="#1e3a8a">q0 = q2 (pair)</text>
  <rect x="214" y="356" width="92" height="22" fill="#FEE2E2" stroke="#DC2626" stroke-width="1" rx="4"/>
  <text x="260" y="371" text-anchor="middle" font-size="10" fill="#991b1b">q1 = q3 (impair)</text>

  <!-- CENTER ARROW -->
  <line x1="330" y1="245" x2="410" y2="245" stroke="#6B7280" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="370" y="237" text-anchor="middle" font-size="10" fill="#6B7280">Nerode</text>
  <text x="370" y="252" text-anchor="middle" font-size="10" fill="#6B7280">min.</text>

  <!-- RIGHT: Minimal 2-state automaton -->
  <text x="625" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">Automate minimal -- 2 etats</text>

  <!-- Initial arrow -->
  <line x1="468" y1="245" x2="495" y2="245" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <!-- State A = [q0,q2] accepting -->
  <circle cx="540" cy="245" r="38" fill="white" stroke="#2563EB" stroke-width="2.5"/>
  <circle cx="540" cy="245" r="30" fill="none" stroke="#2563EB" stroke-width="1.5"/>
  <text x="540" y="241" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">A</text>
  <text x="540" y="257" text-anchor="middle" font-size="9" fill="#2563EB">[q0,q2]</text>

  <!-- State B = [q1,q3] -->
  <circle cx="710" cy="245" r="38" fill="white" stroke="#374151" stroke-width="2"/>
  <text x="710" y="241" text-anchor="middle" font-size="13" font-weight="bold" fill="#374151">B</text>
  <text x="710" y="257" text-anchor="middle" font-size="9" fill="#6B7280">[q1,q3]</text>

  <!-- transition A vers B sur a -->
  <line x1="578" y1="232" x2="670" y2="232" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="624" y="224" text-anchor="middle" font-size="12" fill="#16a34a" font-weight="bold">a</text>

  <!-- transition B vers A sur a -->
  <path d="M670,258 Q624,284 578,258" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  <text x="624" y="285" text-anchor="middle" font-size="12" fill="#16a34a" font-weight="bold">a</text>

  <!-- boucle A sur b -->
  <path d="M522,208 Q490,162 558,208" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  <text x="510" y="165" text-anchor="middle" font-size="12" fill="#dc2626" font-weight="bold">b</text>

  <!-- boucle B sur b -->
  <path d="M693,208 Q704,160 728,208" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  <text x="722" y="162" text-anchor="middle" font-size="12" fill="#dc2626" font-weight="bold">b</text>

  <!-- Nerode table -->
  <rect x="430" y="310" width="400" height="170" fill="white" stroke="#E2E8F0" stroke-width="1.5" rx="6"/>
  <text x="630" y="330" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">Table d'equivalence de Nerode</text>

  <!-- Table header bg -->
  <rect x="430" y="336" width="400" height="22" fill="#EFF6FF"/>
  <text x="520" y="351" text-anchor="middle" font-size="10" font-weight="bold" fill="#374151">Etat</text>
  <text x="650" y="351" text-anchor="middle" font-size="10" font-weight="bold" fill="#374151">delta(., a)</text>
  <text x="780" y="351" text-anchor="middle" font-size="10" font-weight="bold" fill="#374151">delta(., b)</text>

  <!-- Grid lines -->
  <line x1="575" y1="336" x2="575" y2="472" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="710" y1="336" x2="710" y2="472" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="430" y1="358" x2="830" y2="358" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="430" y1="374" x2="830" y2="374" stroke="#E2E8F0" stroke-width="0.8"/>
  <line x1="430" y1="390" x2="830" y2="390" stroke="#E2E8F0" stroke-width="0.8"/>
  <line x1="430" y1="406" x2="830" y2="406" stroke="#E2E8F0" stroke-width="0.8"/>
  <line x1="430" y1="422" x2="830" y2="422" stroke="#E2E8F0" stroke-width="0.8"/>
  <line x1="430" y1="438" x2="830" y2="438" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Table rows -->
  <text x="520" y="370" text-anchor="middle" font-size="10" fill="#1e3a8a">q0 (final)</text>
  <text x="650" y="370" text-anchor="middle" font-size="10" fill="#374151">q1</text>
  <text x="780" y="370" text-anchor="middle" font-size="10" fill="#374151">q0</text>

  <text x="520" y="386" text-anchor="middle" font-size="10" fill="#374151">q1</text>
  <text x="650" y="386" text-anchor="middle" font-size="10" fill="#374151">q0</text>
  <text x="780" y="386" text-anchor="middle" font-size="10" fill="#374151">q1</text>

  <text x="520" y="402" text-anchor="middle" font-size="10" fill="#1e3a8a">q2 (final)</text>
  <text x="650" y="402" text-anchor="middle" font-size="10" fill="#374151">q3</text>
  <text x="780" y="402" text-anchor="middle" font-size="10" fill="#374151">q2</text>

  <text x="520" y="418" text-anchor="middle" font-size="10" fill="#374151">q3</text>
  <text x="650" y="418" text-anchor="middle" font-size="10" fill="#374151">q2</text>
  <text x="780" y="418" text-anchor="middle" font-size="10" fill="#374151">q3</text>

  <!-- Conclusion -->
  <rect x="430" y="438" width="400" height="22" fill="#DCFCE7" rx="3"/>
  <text x="630" y="453" text-anchor="middle" font-size="10" fill="#166534">q0 ≡ q2 et q1 ≡ q3  →  2 classes d'equivalence : automate minimal</text>

  <!-- Legend bottom left -->
  <circle cx="50" cy="446" r="10" fill="white" stroke="#2563EB" stroke-width="2"/>
  <circle cx="50" cy="446" r="7" fill="none" stroke="#2563EB" stroke-width="1"/>
  <text x="68" y="450" font-size="9" fill="#374151">= etat final (double cercle)</text>
  <line x1="38" y1="468" x2="58" y2="468" stroke="#16a34a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="68" y="472" font-size="9" fill="#374151">= transition sur 'a'</text>
  <line x1="38" y1="488" x2="58" y2="488" stroke="#dc2626" stroke-width="2" marker-end="url(#arr)"/>
  <text x="68" y="492" font-size="9" fill="#374151">= transition sur 'b'</text>
</svg>
