  <text x="650" y="92" text-anchor="middle" font-size="10" font-weight="bold" fill="#4ade80">MySQL</text>
  <text x="650" y="108" text-anchor="middle" font-size="9" fill="#86efac">Sequelize ORM</text>

  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Code left panel -->
  <rect x="14" y="132" width="392" height="296" fill="#0d1117" rx="8" stroke="#1e293b" stroke-width="1"/>
  <text x="30" y="152" font-size="9" font-family="Courier New,monospace" fill="#6c7086">// middleware/auth.js</text>
  <text x="30" y="168" font-size="9" font-family="Courier New,monospace" fill="#89b4fa">const</text>
  <text x="57" y="168" font-size="9" font-family="Courier New,monospace" fill="#cdd6f4"> verifyToken = (req, res, next) =&gt; {</text>
  <text x="30" y="184" font-size="9" font-family="Courier New,monospace" fill="#89b4fa">  const</text>
  <text x="60" y="184" font-size="9" font-family="Courier New,monospace" fill="#cdd6f4"> token = req.headers[</text>
  <text x="170" y="184" font-size="9" font-family="Courier New,monospace" fill="#a6e3a1">'authorization'</text>
  <text x="248" y="184" font-size="9" font-family="Courier New,monospace" fill="#cdd6f4">]</text>
  <text x="258" y="184" font-size="9" font-family="Courier New,monospace" fill="#f9e2af">?.split</text>
  <text x="296" y="184" font-size="9" font-family="Courier New,monospace" fill="#cdd6f4">(</text>
  <text x="300" y="184" font-size="9" font-family="Courier New,monospace" fill="#a6e3a1">' '</text>
  <text x="312" y="184" font-size="9" font-family="Courier New,monospace" fill="#cdd6f4">)[1];</text>
  <text x="30" y="200" font-size="9" font-family="Courier New,monospace" fill="#89b4fa">  if</text>
  <text x="48" y="200" font-size="9" font-family="Courier New,monospace" fill="#cdd6f4"> (!token) </text>
  <text x="96" y="200" font-size="9" font-family="Courier New,monospace" fill="#89b4fa">return</text>
  <text x="126" y="200" font-size="9" font-family="Courier New,monospace" fill="#cdd6f4"> res.</text>
  <text x="144" y="200" font-size="9" font-family="Courier New,monospace" fill="#a6e3a1">status</text>
  <text x="176" y="200" font-size="9" font-family="Courier New,monospace" fill="#cdd6f4">(</text>
  <text x="180" y="200" font-size="9" font-family="Courier New,monospace" fill="#f9e2af">401</text>
  <text x="198" y="200" font-size="9" font-family="Courier New,monospace" fill="#cdd6f4">).</text>
  <text x="206" y="200" font-size="9" font-family="Courier New,monospace" fill="#a6e3a1">json</text>
  <text x="226" y="200" font-size="9" font-family="Courier New,monospace" fill="#cdd6f4">({ error: </text>
  <text x="278" y="200" font-size="9" font-family="Courier New,monospace" fill="#a6e3a1">'Unauthorized'</text>
  <text x="350" y="200" font-size="9" font-family="Courier New,monospace" fill="#cdd6f4"> });</text>
  <text x="30" y="216" font-size="9" font-family="Courier New,monospace" fill="#89b4fa">  try</text>
  <text x="54" y="216" font-size="9" font-family="Courier New,monospace" fill="#cdd6f4"> {</text>
  <text x="30" y="232" font-size="9" font-family="Courier New,monospace" fill="#cdd6f4">    req.user = jwt.</text>
  <text x="112" y="232" font-size="9" font-family="Courier New,monospace" fill="#a6e3a1">verify</text>
  <text x="140" y="232" font-size="9" font-family="Courier New,monospace" fill="#cdd6f4">(token, process.env.</text>
  <text x="242" y="232" font-size="9" font-family="Courier New,monospace" fill="#f9e2af">JWT_SECRET</text>
  <text x="296" y="232" font-size="9" font-family="Courier New,monospace" fill="#cdd6f4">);</text>
  <text x="30" y="248" font-size="9" font-family="Courier New,monospace" fill="#89b4fa">    if</text>
  <text x="48" y="248" font-size="9" font-family="Courier New,monospace" fill="#cdd6f4"> (!req.user.roles.</text>
  <text x="132" y="248" font-size="9" font-family="Courier New,monospace" fill="#a6e3a1">includes</text>
  <text x="172" y="248" font-size="9" font-family="Courier New,monospace" fill="#cdd6f4">(</text>
  <text x="176" y="248" font-size="9" font-family="Courier New,monospace" fill="#a6e3a1">'admin'</text>
  <text x="210" y="248" font-size="9" font-family="Courier New,monospace" fill="#cdd6f4">)) req.isAdmin = </text>
  <text x="306" y="248" font-size="9" font-family="Courier New,monospace" fill="#89b4fa">false</text>
  <text x="336" y="248" font-size="9" font-family="Courier New,monospace" fill="#cdd6f4">;</text>
  <text x="30" y="264" font-size="9" font-family="Courier New,monospace" fill="#cdd6f4">    </text>
  <text x="42" y="264" font-size="9" font-family="Courier New,monospace" fill="#a6e3a1">next</text>
  <text x="66" y="264" font-size="9" font-family="Courier New,monospace" fill="#cdd6f4">();</text>
  <text x="30" y="280" font-size="9" font-family="Courier New,monospace" fill="#cdd6f4">  } </text>
  <text x="54" y="280" font-size="9" font-family="Courier New,monospace" fill="#89b4fa">catch</text>
  <text x="82" y="280" font-size="9" font-family="Courier New,monospace" fill="#cdd6f4"> { res.</text>
  <text x="108" y="280" font-size="9" font-family="Courier New,monospace" fill="#a6e3a1">status</text>
  <text x="140" y="280" font-size="9" font-family="Courier New,monospace" fill="#cdd6f4">(</text>
  <text x="144" y="280" font-size="9" font-family="Courier New,monospace" fill="#f9e2af">403</text>
  <text x="162" y="280" font-size="9" font-family="Courier New,monospace" fill="#cdd6f4">).</text>
  <text x="170" y="280" font-size="9" font-family="Courier New,monospace" fill="#a6e3a1">json</text>
  <text x="190" y="280" font-size="9" font-family="Courier New,monospace" fill="#cdd6f4">({ error: </text>
  <text x="242" y="280" font-size="9" font-family="Courier New,monospace" fill="#a6e3a1">'Invalid token'</text>
  <text x="322" y="280" font-size="9" font-family="Courier New,monospace" fill="#cdd6f4"> }); }</text>
  <text x="30" y="296" font-size="9" font-family="Courier New,monospace" fill="#cdd6f4">};</text>

  <text x="30" y="316" font-size="9" font-family="Courier New,monospace" fill="#6c7086">// tests/auth.test.js — Jest + Supertest</text>
  <text x="30" y="332" font-size="9" font-family="Courier New,monospace" fill="#a6e3a1">describe</text>
  <text x="78" y="332" font-size="9" font-family="Courier New,monospace" fill="#cdd6f4">(</text>
  <text x="82" y="332" font-size="9" font-family="Courier New,monospace" fill="#a6e3a1">'Auth middleware'</text>
  <text x="172" y="332" font-size="9" font-family="Courier New,monospace" fill="#cdd6f4">, () =&gt; {</text>
  <text x="30" y="348" font-size="9" font-family="Courier New,monospace" fill="#a6e3a1">  it</text>
  <text x="42" y="348" font-size="9" font-family="Courier New,monospace" fill="#cdd6f4">(</text>
  <text x="46" y="348" font-size="9" font-family="Courier New,monospace" fill="#a6e3a1">'rejette sans token'</text>
  <text x="148" y="348" font-size="9" font-family="Courier New,monospace" fill="#cdd6f4">, async () =&gt; {</text>
  <text x="30" y="364" font-size="9" font-family="Courier New,monospace" fill="#cdd6f4">    const res = await request(app).</text>
  <text x="196" y="364" font-size="9" font-family="Courier New,monospace" fill="#a6e3a1">get</text>
  <text x="212" y="364" font-size="9" font-family="Courier New,monospace" fill="#cdd6f4">(</text>
  <text x="216" y="364" font-size="9" font-family="Courier New,monospace" fill="#a6e3a1">'/api/v1/users'</text>
  <text x="304" y="364" font-size="9" font-family="Courier New,monospace" fill="#cdd6f4">);</text>
  <text x="30" y="380" font-size="9" font-family="Courier New,monospace" fill="#cdd6f4">    expect(res.statusCode).</text>
  <text x="168" y="380" font-size="9" font-family="Courier New,monospace" fill="#a6e3a1">toBe</text>
  <text x="192" y="380" font-size="9" font-family="Courier New,monospace" fill="#cdd6f4">(</text>
  <text x="196" y="380" font-size="9" font-family="Courier New,monospace" fill="#f9e2af">401</text>
  <text x="214" y="380" font-size="9" font-family="Courier New,monospace" fill="#cdd6f4">); });</text>
  <text x="30" y="396" font-size="9" font-family="Courier New,monospace" fill="#cdd6f4">});</text>

  <!-- Right panel: test results + endpoints -->
  <rect x="422" y="132" width="384" height="296" fill="#0d1117" rx="8" stroke="#1e293b" stroke-width="1"/>
  <text x="438" y="152" font-size="9" font-family="Courier New,monospace" fill="#6c7086">$ npm test</text>
  <text x="438" y="168" font-size="9" font-family="Courier New,monospace" fill="#475569">PASS  tests/auth.test.js</text>
  <text x="438" y="184" font-size="9" font-family="Courier New,monospace" fill="#4ade80">  v rejette sans token (401)</text>
  <text x="438" y="200" font-size="9" font-family="Courier New,monospace" fill="#4ade80">  v accepte token valide (200)</text>
  <text x="438" y="216" font-size="9" font-family="Courier New,monospace" fill="#4ade80">  v refuse role insuffisant (403)</text>
  <text x="438" y="232" font-size="9" font-family="Courier New,monospace" fill="#4ade80">  v token expire (403)</text>
  <text x="438" y="248" font-size="9" font-family="Courier New,monospace" fill="#475569">PASS  tests/users.test.js (8 tests)</text>
  <text x="438" y="264" font-size="9" font-family="Courier New,monospace" fill="#475569">PASS  tests/integration.test.js (5 tests)</text>

  <rect x="430" y="276" width="368" height="22" fill="#1a3a2a" rx="4"/>
  <text x="614" y="291" text-anchor="middle" font-size="9" font-family="Courier New,monospace" fill="#4ade80">Tests: 17 passed · Coverage: 87% · Time: 3.2s</text>

  <text x="438" y="318" font-size="9" font-family="Courier New,monospace" fill="#6c7086">Endpoints REST :</text>
  <text x="438" y="334" font-size="9" font-family="Courier New,monospace" fill="#f9e2af">POST</text>
  <text x="468" y="334" font-size="9" font-family="Courier New,monospace" fill="#cdd6f4">  /api/v1/auth/login</text>
  <text x="438" y="350" font-size="9" font-family="Courier New,monospace" fill="#89b4fa">GET</text>
  <text x="462" y="350" font-size="9" font-family="Courier New,monospace" fill="#cdd6f4">   /api/v1/users           [admin]</text>
  <text x="438" y="366" font-size="9" font-family="Courier New,monospace" fill="#89b4fa">GET</text>
  <text x="462" y="366" font-size="9" font-family="Courier New,monospace" fill="#cdd6f4">   /api/v1/users/:id       [auth]</text>
  <text x="438" y="382" font-size="9" font-family="Courier New,monospace" fill="#a6e3a1">PATCH</text>
  <text x="470" y="382" font-size="9" font-family="Courier New,monospace" fill="#cdd6f4"> /api/v1/users/:id       [auth]</text>
  <text x="438" y="398" font-size="9" font-family="Courier New,monospace" fill="#f38ba8">DELETE</text>
  <text x="474" y="398" font-size="9" font-family="Courier New,monospace" fill="#cdd6f4">/api/v1/users/:id       [admin]</text>
  <text x="438" y="414" font-size="9" font-family="Courier New,monospace" fill="#f9e2af">POST</text>
  <text x="468" y="414" font-size="9" font-family="Courier New,monospace" fill="#cdd6f4">  /api/v1/offres           [auth]</text>
</svg>
