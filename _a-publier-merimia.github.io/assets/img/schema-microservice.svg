<svg viewBox="0 0 820 460" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif">
  <rect width="820" height="460" fill="#0f172a" rx="10"/>
  <rect width="820" height="34" fill="#1e293b" rx="10"/>
  <rect y="20" width="820" height="14" fill="#1e293b"/>
  <circle cx="18" cy="17" r="6" fill="#f38ba8"/>
  <circle cx="38" cy="17" r="6" fill="#f9e2af"/>
  <circle cx="58" cy="17" r="6" fill="#a6e3a1"/>
  <text x="410" y="22" text-anchor="middle" font-size="12" fill="#94a3b8">EtudiantProConnect — Microservice REST securise · Node.js · Stage S6</text>

  <!-- Architecture diagram top -->
  <text x="410" y="58" text-anchor="middle" font-size="12" font-weight="bold" fill="#60a5fa">Architecture Microservice — JWT + RBAC</text>

  <!-- Client -->
  <rect x="20" y="72" width="100" height="44" fill="#1e3a5f" stroke="#2563EB" stroke-width="1.5" rx="6"/>
  <text x="70" y="92" text-anchor="middle" font-size="10" font-weight="bold" fill="#60a5fa">Client</text>
  <text x="70" y="108" text-anchor="middle" font-size="9" fill="#94a3b8">React / Mobile</text>

  <!-- Arrow -->
  <line x1="120" y1="94" x2="154" y2="94" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="137" y="88" text-anchor="middle" font-size="8" fill="#94a3b8">HTTPS</text>

  <!-- Auth middleware -->
  <rect x="155" y="72" width="120" height="44" fill="#1e3a5f" stroke="#f59e0b" stroke-width="1.5" rx="6"/>
  <text x="215" y="92" text-anchor="middle" font-size="10" font-weight="bold" fill="#f59e0b">Auth Middleware</text>
  <text x="215" y="108" text-anchor="middle" font-size="9" fill="#94a3b8">JWT verify + RBAC</text>

  <!-- Arrow -->
  <line x1="275" y1="94" x2="309" y2="94" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Router -->
  <rect x="310" y="72" width="110" height="44" fill="#1e3a5f" stroke="#2563EB" stroke-width="1.5" rx="6"/>
  <text x="365" y="92" text-anchor="middle" font-size="10" font-weight="bold" fill="#60a5fa">Router Express</text>
  <text x="365" y="108" text-anchor="middle" font-size="9" fill="#94a3b8">/api/v1/*</text>

  <!-- Arrow -->
  <line x1="420" y1="94" x2="454" y2="94" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Controllers -->
  <rect x="455" y="72" width="110" height="44" fill="#1e3a5f" stroke="#2563EB" stroke-width="1.5" rx="6"/>
