<svg viewBox="0 0 820 460" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif">
  <rect width="820" height="460" fill="#1e1e2e" rx="10"/>
  <!-- Title bar -->
  <rect width="820" height="34" fill="#313244" rx="10"/>
  <rect y="20" width="820" height="14" fill="#313244"/>
  <circle cx="18" cy="17" r="6" fill="#f38ba8"/>
  <circle cx="38" cy="17" r="6" fill="#f9e2af"/>
  <circle cx="58" cy="17" r="6" fill="#a6e3a1"/>
  <text x="410" y="22" text-anchor="middle" font-size="12" fill="#cdd6f4">MinMaxMorpion.java — Terminal</text>

  <!-- Left panel: Code -->
  <text x="24" y="62" font-size="10" font-family="Courier New,monospace" fill="#6c7086">// Algorithme MinMax — Jeu du Morpion</text>
  <text x="24" y="78" font-size="10" font-family="Courier New,monospace" fill="#89b4fa">public int</text>
  <text x="88" y="78" font-size="10" font-family="Courier New,monospace" fill="#a6e3a1"> minMax</text>
  <text x="134" y="78" font-size="10" font-family="Courier New,monospace" fill="#cdd6f4">(int[][] board, boolean isMax) {</text>
  <text x="24" y="94" font-size="10" font-family="Courier New,monospace" fill="#cdd6f4">    int score = </text>
  <text x="107" y="94" font-size="10" font-family="Courier New,monospace" fill="#a6e3a1">evaluerGrille</text>
  <text x="183" y="94" font-size="10" font-family="Courier New,monospace" fill="#cdd6f4">(board);</text>
  <text x="24" y="110" font-size="10" font-family="Courier New,monospace" fill="#89b4fa">    if </text>
  <text x="46" y="110" font-size="10" font-family="Courier New,monospace" fill="#cdd6f4">(score != 0) </text>
  <text x="130" y="110" font-size="10" font-family="Courier New,monospace" fill="#89b4fa">return</text>
  <text x="166" y="110" font-size="10" font-family="Courier New,monospace" fill="#cdd6f4"> score;</text>
  <text x="24" y="126" font-size="10" font-family="Courier New,monospace" fill="#89b4fa">    if </text>
  <text x="46" y="126" font-size="10" font-family="Courier New,monospace" fill="#cdd6f4">(!</text>
  <text x="58" y="126" font-size="10" font-family="Courier New,monospace" fill="#a6e3a1">coupsPossibles</text>
  <text x="148" y="126" font-size="10" font-family="Courier New,monospace" fill="#cdd6f4">(board)) </text>
  <text x="208" y="126" font-size="10" font-family="Courier New,monospace" fill="#89b4fa">return</text>
  <text x="244" y="126" font-size="10" font-family="Courier New,monospace" fill="#f9e2af"> 0</text>
  <text x="256" y="126" font-size="10" font-family="Courier New,monospace" fill="#cdd6f4">;</text>
  <text x="24" y="142" font-size="10" font-family="Courier New,monospace" fill="#89b4fa">    if </text>
  <text x="46" y="142" font-size="10" font-family="Courier New,monospace" fill="#cdd6f4">(isMax) {</text>
  <text x="24" y="158" font-size="10" font-family="Courier New,monospace" fill="#cdd6f4">        int best = </text>
  <text x="111" y="158" font-size="10" font-family="Courier New,monospace" fill="#f9e2af">-1000</text>
  <text x="149" y="158" font-size="10" font-family="Courier New,monospace" fill="#cdd6f4">;</text>
  <text x="24" y="174" font-size="10" font-family="Courier New,monospace" fill="#89b4fa">        for </text>
  <text x="68" y="174" font-size="10" font-family="Courier New,monospace" fill="#cdd6f4">(int[] coup : </text>
  <text x="161" y="174" font-size="10" font-family="Courier New,monospace" fill="#a6e3a1">getCoupsLibres</text>
  <text x="249" y="174" font-size="10" font-family="Courier New,monospace" fill="#cdd6f4">(board)) {</text>
  <text x="24" y="190" font-size="10" font-family="Courier New,monospace" fill="#cdd6f4">            board[coup[0]][coup[1]] = </text>
  <text x="228" y="190" font-size="10" font-family="Courier New,monospace" fill="#f9e2af">X</text>
  <text x="237" y="190" font-size="10" font-family="Courier New,monospace" fill="#cdd6f4">;</text>
  <text x="24" y="206" font-size="10" font-family="Courier New,monospace" fill="#cdd6f4">            best = Math.</text>
  <text x="140" y="206" font-size="10" font-family="Courier New,monospace" fill="#a6e3a1">max</text>
  <text x="163" y="206" font-size="10" font-family="Courier New,monospace" fill="#cdd6f4">(best, </text>
  <text x="204" y="206" font-size="10" font-family="Courier New,monospace" fill="#a6e3a1">minMax</text>
  <text x="240" y="206" font-size="10" font-family="Courier New,monospace" fill="#cdd6f4">(board, </text>
  <text x="282" y="206" font-size="10" font-family="Courier New,monospace" fill="#89b4fa">false</text>
  <text x="312" y="206" font-size="10" font-family="Courier New,monospace" fill="#cdd6f4">));</text>
  <text x="24" y="222" font-size="10" font-family="Courier New,monospace" fill="#cdd6f4">            board[coup[0]][coup[1]] = </text>
  <text x="228" y="222" font-size="10" font-family="Courier New,monospace" fill="#f9e2af">VIDE</text>
  <text x="258" y="222" font-size="10" font-family="Courier New,monospace" fill="#cdd6f4">;</text>
  <text x="24" y="238" font-size="10" font-family="Courier New,monospace" fill="#cdd6f4">        }  </text>
  <text x="24" y="254" font-size="10" font-family="Courier New,monospace" fill="#89b4fa">        return</text>
  <text x="84" y="254" font-size="10" font-family="Courier New,monospace" fill="#cdd6f4"> best;</text>
  <text x="24" y="270" font-size="10" font-family="Courier New,monospace" fill="#cdd6f4">    } </text>
  <text x="54" y="270" font-size="10" font-family="Courier New,monospace" fill="#89b4fa">else</text>
  <text x="78" y="270" font-size="10" font-family="Courier New,monospace" fill="#cdd6f4"> { </text>
  <text x="96" y="270" font-size="10" font-family="Courier New,monospace" fill="#6c7086">/* isMin — symétrique */</text>
  <text x="24" y="286" font-size="10" font-family="Courier New,monospace" fill="#cdd6f4">    }</text>
  <text x="24" y="302" font-size="10" font-family="Courier New,monospace" fill="#cdd6f4">}</text>

  <!-- Divider -->
  <line x1="400" y1="44" x2="400" y2="430" stroke="#45475a" stroke-width="1"/>

  <!-- Right panel: Terminal output -->
  <text x="420" y="62" font-size="10" font-family="Courier New,monospace" fill="#89b4fa">$ java MinMaxMorpion</text>
  <text x="420" y="80" font-size="10" font-family="Courier New,monospace" fill="#cdd6f4">Grille actuelle :</text>
  <!-- Board display -->
  <text x="420" y="100" font-size="12" font-family="Courier New,monospace" fill="#cdd6f4"> X | O | X</text>
  <text x="420" y="114" font-size="10" font-family="Courier New,monospace" fill="#45475a">-----------</text>
  <text x="420" y="130" font-size="12" font-family="Courier New,monospace" fill="#cdd6f4"> O |</text>
  <text x="454" y="130" font-size="12" font-family="Courier New,monospace" fill="#6c7086"> _ </text>
  <text x="478" y="130" font-size="12" font-family="Courier New,monospace" fill="#cdd6f4">|</text>
  <text x="490" y="130" font-size="12" font-family="Courier New,monospace" fill="#6c7086"> _</text>
  <text x="420" y="144" font-size="10" font-family="Courier New,monospace" fill="#45475a">-----------</text>
  <text x="420" y="160" font-size="12" font-family="Courier New,monospace" fill="#6c7086"> _ | _ | _</text>

  <text x="420" y="184" font-size="10" font-family="Courier New,monospace" fill="#cdd6f4">Calcul MinMax en cours...</text>
  <text x="420" y="202" font-size="10" font-family="Courier New,monospace" fill="#6c7086">  minMax(1,1, isMax=true)  -> score: +10 [X gagne]</text>
  <text x="420" y="218" font-size="10" font-family="Courier New,monospace" fill="#6c7086">  minMax(1,2, isMax=true)  -> score:   0 [match nul]</text>
  <text x="420" y="234" font-size="10" font-family="Courier New,monospace" fill="#6c7086">  minMax(2,0, isMax=true)  -> score: -10 [O gagne]</text>
  <text x="420" y="250" font-size="10" font-family="Courier New,monospace" fill="#6c7086">  minMax(2,1, isMax=true)  -> score:   0 [match nul]</text>
  <text x="420" y="266" font-size="10" font-family="Courier New,monospace" fill="#6c7086">  minMax(2,2, isMax=true)  -> score:   0 [match nul]</text>

  <text x="420" y="290" font-size="10" font-family="Courier New,monospace" fill="#a6e3a1">Noeuds explores : 127</text>
  <text x="420" y="308" font-size="10" font-family="Courier New,monospace" fill="#a6e3a1">Profondeur max atteinte : 5</text>

  <!-- Best move highlight -->
  <rect x="414" y="320" width="380" height="50" fill="#1a3a2a" rx="6" stroke="#a6e3a1" stroke-width="1"/>
  <text x="604" y="340" text-anchor="middle" font-size="11" font-family="Courier New,monospace" fill="#a6e3a1">Meilleur coup pour X :</text>
  <text x="604" y="358" text-anchor="middle" font-size="12" font-family="Courier New,monospace" fill="#a6e3a1">  position (1, 1) — score = +10</text>

  <!-- Board result -->
  <text x="420" y="400" font-size="10" font-family="Courier New,monospace" fill="#f9e2af"> X | O | X</text>
  <text x="420" y="416" font-size="10" font-family="Courier New,monospace" fill="#f9e2af"> O | X | _</text>
  <text x="420" y="432" font-size="10" font-family="Courier New,monospace" fill="#f9e2af"> _ | _ | _</text>
  <text x="640" y="432" font-size="10" font-family="Courier New,monospace" fill="#6c7086">^ IA joue ici</text>
</svg>
